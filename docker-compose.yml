services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-smart_invoice_pro}
      MYSQL_USER: ${DB_USER:-sip_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-this-local-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-this-root-password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - smart_invoice_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  smart_invoice_mysql:
